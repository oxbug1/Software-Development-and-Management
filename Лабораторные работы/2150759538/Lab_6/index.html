<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<form action="#" name="authorization" method="post">
		<label>Логин:<br><input type="text" name="login"><br></label>
		<label>Пароль:<br><input type="password" name="password"></label><br>
		<label><input type="checkbox" name="remember-me">Запомнить</label><br>
		<button type="submit">Вход</button>
	</form><br>
	<form action="#" name="choice-of-transport">
		<label><input type="checkbox" name="fly">Самолет</label><br>
		<label><input type="checkbox" name="train">Поезд</label><br>
		<label><input type="checkbox" name="auto">Автомобиль</label><br>
		<label><input type="checkbox" name="bus">Автобус</label><br>
		<button>ОК</button> 
		<button type="reset">Сбросить</button>
	</form><br>
	<form action="#" name="registration-form" method="post">
		<fieldset>
			<legend>Форма регистрации</legend>
			Обращение
			<label><input name="gender" type="radio" id="male">Г-н</label>
			<label><input name="gender" type="radio" id="female">Г-жа</label><br><br>
			Имя <input required  type="text" name="name"><br><br>
			Дата рождения <input required type="date"><br><br>
			Email <input required type="email" name="email"><br><br>
			Телефон <input required pattern="[0-9]{1}-[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}" placeholder="8-918-000-00-00" name="phone"><br><br>
			Пароль <input required type="password" name="password"><br><br>
			Страна
			<select>
				<option>Россия</option>
				<option>Япония</option>
				<option>Уругвай</option>
				<option>Зимбабве</option>
				<option>Австралия</option>
			</select><br><br>
			<input type="checkbox" checked name="terms-of-use">Я согласен с <a href="#">условиями использования</a><br><br>
			<button>Зарегистрироваться</button>
		</fieldset>
	</form>
</body>
</html>
