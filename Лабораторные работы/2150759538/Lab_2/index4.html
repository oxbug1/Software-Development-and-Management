<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Михайлов</title>
</head>
<body>
	<h1 align="center">Осенние листочки</h1>
	<p>
		<font color="red"><i>Листочки танцуют, листочки кружатся</i></font></br>
		<b>И ярким ковром мне под ноги ложатся.</b></br>
		<ins>Как будто ужасно они занятые,</ins></br>
		<b><font color="green">Зелёные</font>, <font color="red">красные</font> и <font color="yellow">золотые</font>…</b>
	</p>
	<p align="center">
		Листья кленовые, листья дубовые,</br>
		<font color="orange">Пурпурные, алые, даже бордовые…</font>
	</p>
	<p align="right">
		Бросаюсь я листьями вверх наугад —</br>
		<font color="red"><b>Я тоже устроить могу листопад!</b></font>
	</p>
	<h3 align="right">Ю.Каспарова</h3>
</body>
</html>
